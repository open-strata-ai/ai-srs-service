# Offline test profile: H2 in-memory backs JPA so `mvn test` needs no live PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:mem:srs;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

openstrata:
  features:
    srs:
      enabled: true
    skill-test:
      enabled: true
    rule-engine:
      opa:
        enabled: true
      drools:
        enabled: false
    dev-mode:
      # Dev mode mints tenant_id=local platform-admin so the AuthInterceptor is a no-op for tests.
      enabled: true
  spi:
    object-store:
      enabled: false
